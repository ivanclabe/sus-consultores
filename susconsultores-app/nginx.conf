server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite genera nombres con hash de contenido: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # La app usa rutas del navegador (react-router): /kitchen, /customers/:id,
    # /supply/compras/... no existen como archivos. Todo lo que no sea un
    # archivo real se sirve con index.html para que el router lo resuelva;
    # sin esto, recargar cualquier página que no sea "/" da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: así cada deploy se ve de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
